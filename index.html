<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e19"><title>LAST MISSION · NEXUS</title>
<style>
:root{color-scheme:dark;--bg:#080e19;--panel:#101b2b;--border:#32465c;--cyan:#67e8f9;--muted:#94a3b8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#102b40 0,#080e19 60%);color:#e2e8f0;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}main{max-width:820px;margin:auto;padding:24px 18px 50px}
h1{margin:6px 0;letter-spacing:.12em;color:#fff;font-size:clamp(28px,6vw,48px)}h2{font-size:clamp(20px,4vw,28px);line-height:1.25}h3{color:var(--cyan)}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:2px}.muted{color:var(--muted)}
section{background:rgba(16,27,43,.96);border:1px solid var(--border);border-radius:17px;padding:clamp(15px,4vw,26px);margin:17px 0;box-shadow:0 20px 75px #0004}
button,input,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #475569;background:#172438;color:#fff}input,select{max-width:100%;width:100%;margin:7px 0 15px}button{cursor:pointer;background:#14536b;border-color:#23677d;font-weight:600;transition:.15s}button:hover:not(:disabled){background:#1a6c86}button:disabled{opacity:.42;cursor:default}
label{display:block;margin:12px 0}.radio{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:9px}.radio input{width:auto;margin:0}
button.ghost{background:#172438}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}nav button{font-size:13px}.orb{margin:24px auto;width:142px;height:142px;border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 35px #0891b280,inset 0 0 30px #0891b255;color:#a5f3fc;letter-spacing:3px;font-weight:800;animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 65px #0891b2a0,inset 0 0 30px #0891b277}}
.error{color:#fca5a5;min-height:24px}.banner{border:1px solid #155e75;border-radius:9px;background:#12384c;padding:10px 14px;color:#a5f3fc}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.pill{display:inline-block;color:#67e8f9;border:1px solid #23677d;border-radius:99px;padding:4px 10px;font-size:12px;letter-spacing:1px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #253344;padding:10px 0}.row:last-child{border-bottom:0}.permit{padding:8px 0;border-bottom:1px solid #253344}.permit select{margin:5px 0}.status{color:#fcd34d;letter-spacing:1px}.footer{margin-top:30px;text-align:center;color:var(--muted);font-size:12px}.cinema main{max-width:1100px;text-align:center}.cinema .orb{width:225px;height:225px;font-size:22px}.cinema h2{font-size:clamp(24px,5vw,50px)}.cinema nav{display:none}.cinema section{min-height:64vh;display:flex;flex-direction:column;align-items:center;justify-content:center}.cinema .row{width:100%;max-width:650px}
body.incident{background:radial-gradient(ellipse at top,#4c101a,#080e19 65%)}.incident .orb{border-color:#f87171;color:#f87171;box-shadow:0 0 55px #ef4444}.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.key{padding:12px;border:1px solid #475569;border-radius:8px}.unlocked{color:#67e8f9;border-color:#67e8f9}.credits{white-space:pre-line;line-height:2;text-align:center}.cinema .credits{font-size:24px}.timer{font-size:28px;font-variant-numeric:tabular-nums;color:#fcd34d}.scene{max-width:900px;margin:18px auto;padding:22px;border-left:3px solid #67e8f9;background:#07121d;font-size:clamp(20px,3vw,36px);animation:sceneIn .8s ease-out}.scene p{margin:10px 0}@keyframes sceneIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}.incident .scene{border-color:#ef4444;background:#270c13}.cinema .orb{position:relative}.cinema .orb:before,.cinema .orb:after{content:'';position:absolute;inset:-16px;border:1px dashed #38bdf8;border-radius:50%;animation:spin 18s linear infinite}.cinema .orb:after{inset:-28px;border-style:dotted;animation-direction:reverse}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.cinema .scene{box-shadow:0 0 45px #0891b233}.cinema.incident .scene{animation:alarm 1.5s ease-in-out 3}@keyframes alarm{50%{box-shadow:0 0 70px #ef444466}}.cinema .key.unlocked{background:#12384c;box-shadow:0 0 18px #67e8f955}.cinema .credits{animation:sceneIn 2s ease-out}
body{--scene-color:#67e8f9;--scene-glow:#133a55}
body[data-chapter="2"]{--scene-color:#5eead4;--scene-glow:#12453f}
body[data-chapter="3"]{--scene-color:#fb7185;--scene-glow:#531628}
body[data-chapter="4"]{--scene-color:#fdba74;--scene-glow:#542c18}
body[data-chapter="5"]{--scene-color:#c4b5fd;--scene-glow:#372460}
body[data-chapter="6"]{--scene-color:#fde68a;--scene-glow:#51421d}
body.cinema{background:#060912}
.cinema .screen{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,var(--scene-glow),#07101d 65%);border-color:var(--scene-color);padding:54px 28px}
.cinema .screen::before{content:'';position:absolute;inset:0;z-index:-1;opacity:.24;background:repeating-linear-gradient(0deg,transparent 0 6px,#000 7px 8px);pointer-events:none}
.cinema .orb{border-color:var(--scene-color);color:var(--scene-color);background:radial-gradient(circle,#0005,#000c)}
.cinema .scene,.cinema .pill{border-color:var(--scene-color);color:var(--scene-color);background:#070c18d9}
.cinema .chapter-reset{animation:sceneIn .8s both}
.cinema[data-chapter="2"] .orb{border-radius:14px;transform:rotate(8deg)}
.cinema[data-chapter="3"] .orb{border-style:dashed}
.cinema[data-chapter="4"] .orb{box-shadow:0 0 24px var(--scene-glow)}
.cinema[data-chapter="5"] .orb{width:185px;height:185px;border-radius:50% 50% 12px 12px}
.cinema[data-chapter="6"] .orb{box-shadow:0 0 50px var(--scene-glow),inset 0 0 25px var(--scene-color)}
.cinema.incident .screen{border-color:#fb7185}
.cinema .wheel{border:2px dashed var(--scene-color);border-radius:50%;width:60px;height:60px;display:grid;place-items:center;margin:12px auto;animation:wheel-in .7s ease-out both}
@keyframes wheel-in{from{transform:rotate(-540deg) scale(.4);opacity:.2}}
textarea{font:inherit;color:inherit;background:#081221;border:1px solid #53677d;border-radius:8px;width:100%;min-height:96px;padding:10px}
:focus-visible{outline:2px solid var(--scene-color);outline-offset:3px}
.cinema .finale .credits{animation:sceneIn 2s .3s both}
@media(max-width:540px){.cinema .screen{padding:30px 14px}.cinema .orb{width:140px;height:140px}}
</style></head>
<body><main><div class="eyebrow">UPC · SEGURIDAD DE INTEGRACIÓN DE APLICACIONES</div><h1>LAST MISSION</h1><div class="eyebrow">THE HUMAN FACTOR · NEXUS SYSTEM</div>
<div id="app"></div><div id="error" class="error" role="alert"></div><div class="footer">PROYECTO NEXUS · DEMOSTRACIÓN ACADÉMICA</div>
</main>
<script src="/client.js" defer></script></body></html>
